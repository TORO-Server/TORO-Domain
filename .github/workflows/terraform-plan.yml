name: "Terraform Plan"

# プルリクエストのコードはレビューの前なので、認証情報を渡さない。
# state も Cloudflare も読まず、ダミーの値で構成だけを計画する (空の state からの計画になる)。
# 実際の適用は main の Terraform Apply だけが行う
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      TF_CLI_ARGS: "-no-color"
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_api_token: "0000000000000000000000000000000000000000"
      TF_VAR_cloudflare_account_id: "00000000000000000000000000000000"
      TF_VAR_marumasa_ip: "192.0.2.1"
      TF_VAR_argotunnel_cname_target: "tunnel.example.invalid"
      TF_VAR_gh_pages_challenge_content: "placeholder"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Use a local backend for the plan
        run: printf 'terraform {\n  backend "local" {}\n}\n' > ci_override.tf

      - run: terraform init -lockfile=readonly

      - run: terraform plan -refresh=false -lock=false
