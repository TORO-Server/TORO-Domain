name: "Terraform Apply"

# 認証情報を持つのは main で動くこのジョブだけ。
# 必須レビュアーと secrets の置き場所は、GitHub の Environment (production) で設定する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    name: "Terraform Apply"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_CLI_ARGS: "-no-color"
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # ロックファイルは PR で更新する (Dependabot)。ここでは書き換えない
      - run: terraform init -lockfile=readonly -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # トンネルの識別子は秘密の設定 (ARGOTUNNEL_CNAME_TARGET) の一部。ログに出ても伏せ字にする
      - name: Mask the tunnel id derived from the secret
        run: echo "::add-mask::${ARGOTUNNEL_CNAME_TARGET%.cfargotunnel.com}"
        env:
          ARGOTUNNEL_CNAME_TARGET: ${{ secrets.ARGOTUNNEL_CNAME_TARGET }}

      - run: terraform plan -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_marumasa_ip: ${{ secrets.MARUMASA_IP }}
          TF_VAR_argotunnel_cname_target: ${{ secrets.ARGOTUNNEL_CNAME_TARGET }}
          TF_VAR_gh_pages_challenge_content: ${{ secrets.GH_PAGES_CHALLENGE_CONTENT }}
          TF_VAR_tunnel_origin_services: ${{ secrets.TUNNEL_ORIGIN_SERVICES }}

      # 一時的な安全柵 (トンネルの取り込み専用): 許す変更は「トンネル構成 (ingress) の更新」と、
      # 「トンネル本体の更新のうち差分が account_id だけのもの」。それ以外の作成、更新、削除が 1 件でもあれば、適用せずに止める。取り込みは 2 件ちょうど
      - name: Guard (import + tunnel config update only)
        run: |
          terraform show -json tfplan > plan.json
          bash .github/scripts/tunnel-guard.sh plan.json      - run: terraform apply tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_marumasa_ip: ${{ secrets.MARUMASA_IP }}
          TF_VAR_argotunnel_cname_target: ${{ secrets.ARGOTUNNEL_CNAME_TARGET }}
          TF_VAR_gh_pages_challenge_content: ${{ secrets.GH_PAGES_CHALLENGE_CONTENT }}
          TF_VAR_tunnel_origin_services: ${{ secrets.TUNNEL_ORIGIN_SERVICES }}